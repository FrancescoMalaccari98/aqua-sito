# ============================================================================
#  AQUA — FOTO E VIDEO DEL SITO
#
#  Da questo file si sceglie quale foto (o video) compare in ogni punto del sito.
#  Non serve toccare l'HTML: basta cambiare il percorso e ricaricare la pagina.
#
#  COME SI SCRIVE
#  - Ogni riga è  chiave = valore
#  - Le righe che iniziano con # sono commenti: il sito le ignora
#  - .foto  → percorso dell'immagine, dentro la cartella assets/img
#  - .video → percorso del video, dentro la cartella assets/video
#  - .alt   → descrizione della foto per chi usa un lettore di schermo
#             (aggiornarla quando si cambia la foto; vuota = foto solo decorativa)
#  - Salvare il file in UTF-8
#
#  CONSIGLI PER LE FOTO
#  - Formato JPG, lato lungo tra 1200 e 2000 pixel, peso sotto i 500 KB
#  - Le dimensioni indicate sotto sono quelle delle foto attuali: rispettare
#    lo stesso orientamento (verticale/orizzontale) evita tagli strani
#
#  Le foto dei drink nella carta si scelgono invece in data/menu.properties.
# ============================================================================


# ----------------------------------------------------------------------------
#  HOME · HERO (la prima schermata, in alto a destra, dietro il titolo)
#  È la copertina del video: il primo fotogramma, con il bicchiere vuoto e il ghiaccio.
#  Le foto "finale" (bicchiere pieno) si vedono al posto del video quando il
#  video non può partire (risparmio dati, animazioni ridotte, errore).
#  Desktop: orizzontale 1920×1440 · Mobile: verticale 1080×1350
#  "?v=2" in fondo al percorso obbliga i browser a scaricare la foto nuova
#  invece di usare quella vecchia in memoria: va aumentato (v=3, v=4…) quando
#  si sostituisce un file tenendo lo stesso nome.
# ----------------------------------------------------------------------------
hero.foto               = assets/img/hero-tumbler-1920.jpg
hero.foto.mobile         = assets/img/hero-tumbler-1080.jpg
hero.foto.finale         = assets/img/hero-tumbler-1920-fine.jpg
hero.foto.finale.mobile  = assets/img/hero-tumbler-1080-fine.jpg
hero.alt = Un tumbler di cristallo con ghiaccio, pieno di un distillato ambrato, su fondo nero


# ----------------------------------------------------------------------------
#  HOME · HERO · VIDEO (parte sopra la copertina appena la pagina si apre e
#  ricomincia da capo a ogni giro; muto, senza comandi)
#  Ogni video c'è in due formati:
#  - .hevc → HEVC, più leggero (Safari, iPhone, Chrome su Mac): usato quando
#            il browser lo supporta
#  - senza .hevc → H.264, funziona ovunque: è quello di riserva
#  Desktop: orizzontale 1920×1440 · Mobile: verticale 1080×1350
#  Il primo fotogramma deve coincidere con la copertina (hero.foto), l'ultimo
#  con la foto "finale".
#  "?v=2" funziona come per le foto: aumentarlo se si sostituisce un video
#  tenendo lo stesso nome del file.
#  Senza le righe hero.video… la home mostra solo la foto "finale".
# ----------------------------------------------------------------------------
#  Video attuale: distillato versato su ghiaccio (i primi 26 secondi del
#  filmato originale, a velocità doppia: 13 secondi).
#  Per tornare al video precedente del calice rosso: sostituire "tumbler" con
#  "calice" in queste quattro righe e nelle quattro foto della copertina qui
#  sopra, e rimettere la descrizione:
#  hero.alt = Un calice di cristallo pieno di un drink rosso, su un tagliere di legno, con una fragola accanto
hero.video              = assets/video/aqua-tumbler-1920.mp4
hero.video.hevc         = assets/video/aqua-tumbler-1920.hevc.mp4
hero.video.mobile       = assets/video/aqua-tumbler-1080.mp4
hero.video.mobile.hevc  = assets/video/aqua-tumbler-1080.hevc.mp4


