# ============================================================================
#  AQUA — CARTA DELLE BEVANDE
#
#  Da questo file si aggiorna il menu del sito: la pagina carta.html
#  (quella collegata al QR code). Non serve toccare il codice.
#
#  COME SI SCRIVE
#  - Ogni riga è  chiave = valore
#  - Le righe che iniziano con # sono commenti: il sito le ignora
#  - Salvare il file in UTF-8 (lettere accentate e simbolo € funzionano)
#  - Prezzi: solo il numero, es. 8 oppure 1,30 (il simbolo € lo aggiunge il sito)
#    "da 4" diventa "da € 4"; se il prezzo manca, la riga resta senza prezzo
#  - bicchiere (facoltativo): uno di questi →  coppa, martini, calice, flute, tumbler, highball
#
#  AGGIUNGERE UNA VOCE      → copiare un blocco e cambiare il numero (es. predinner.7.…)
#  TOGLIERE UNA VOCE        → cancellare le righe del suo blocco (i numeri possono saltare)
#  CAMBIARE L'ORDINE        → l'ordine segue il numero, dal più piccolo al più grande
#  NUOVA CATEGORIA          → aggiungerla a "categorie" e scrivere le sue righe
#  Una categoria senza voci non compare nel sito.
#
#  Carta ricevuta dal locale il 14/11/2026. Ancora da completare:
#  - Signature: ingredienti e prezzi
#  - After dinner: prezzi
#  - Birre e vini: tutta la categoria (vedi in fondo)
#  - Campari soda: nella lista era segnato con "(?)", da confermare
# ============================================================================


# --- Impostazioni generali --------------------------------------------------

carta.valuta = €

# Categorie, nell'ordine in cui compaiono nelle schede
