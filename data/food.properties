# ============================================================================
#  AQUA — MENU FOOD
#
#  Da questo file si aggiorna il menu food del sito: la pagina food.html.
#  Funziona come data/menu.properties (la carta delle bevande): non serve
#  toccare il codice.
#
#  COME SI SCRIVE
#  - Ogni riga è  chiave = valore
#  - Le righe che iniziano con # sono commenti: il sito le ignora
#  - Salvare il file in UTF-8 (lettere accentate e simbolo € funzionano)
#  - Prezzi: solo il numero, es. 8 oppure 1,50 (il simbolo € lo aggiunge il sito);
#    se il prezzo manca, la riga resta senza prezzo
#  - ingredienti (facoltativo): una riga di descrizione sotto il nome
#  - gruppo (facoltativo): titoletto dentro la categoria
#
#  AGGIUNGERE UNA VOCE      → copiare un blocco e cambiare il numero (es. food.10.…)
#  TOGLIERE UNA VOCE        → cancellare le righe del suo blocco (i numeri possono saltare)
#  CAMBIARE L'ORDINE        → l'ordine segue il numero, dal più piccolo al più grande
#  NUOVA CATEGORIA          → aggiungerla a "categorie" e scrivere le sue righe
#                             (con più categorie compare la barra delle schede in alto)
#
#  Lista ricevuta dal locale il 24/11/2026. Ogni porzione costa 3 €.
# ============================================================================

